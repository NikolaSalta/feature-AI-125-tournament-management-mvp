# Tournament Management MVP - Application Configuration

# Application name
spring.application.name=tournament-management

# Server configuration
server.port=8080

# Database Configuration - PostgreSQL (production)
# Uncomment these for PostgreSQL:
# spring.datasource.url=jdbc:postgresql://localhost:5432/tournament_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# Database Configuration - H2 (development/testing)
spring.datasource.url=jdbc:h2:mem:tournamentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# For PostgreSQL, use:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.com.tournament.management=DEBUG
logging.level.org.springframework.web=INFO
