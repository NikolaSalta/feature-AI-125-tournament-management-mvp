# -----------------------------------------------------------------------------
# Service for Tournament Service
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: tournament-service
  namespace: chessverse-tournament
  labels:
    app.kubernetes.io/name: tournament-service
    app.kubernetes.io/part-of: chessverse
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: tournament-service

