name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '9.2.1'

jobs:
  # =====================================================
  # Code Quality & Security Checks
  # =====================================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
        
      - name: Run SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest
        continue-on-error: true

  # =====================================================
  # Build & Test
  # =====================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tournament_db
          POSTGRES_USER: tournament_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew build -x test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tournament_db
          DB_USERNAME: tournament_user
          DB_PASSWORD: test_password
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS0yNTZiaXRz
          
      - name: Run tests
        run: ./gradlew test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tournament_db
          DB_USERNAME: tournament_user
          DB_PASSWORD: test_password
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS0yNTZiaXRz
          
      - name: Generate test report
        run: ./gradlew jacocoTestReport
        if: always()
        
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/reports/jacoco/
            
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tournament-service-jar
          path: build/libs/*.jar

  # =====================================================
  # Docker Build
  # =====================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: tournament-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Test Docker image
        run: |
          docker run --rm --name test-container -d \
            -e SPRING_PROFILES_ACTIVE=test \
            -e JWT_SECRET=dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS0yNTZiaXRz \
            -p 8080:8080 \
            tournament-service:${{ github.sha }}
          
          # Wait for container to start
          sleep 30
          
          # Test health endpoint
          curl -f http://localhost:8080/actuator/health || exit 1
          
          # Stop container
          docker stop test-container

  # =====================================================
  # Security Scan
  # =====================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: tournament-service-jar
          path: build/libs/
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =====================================================
  # Deploy to Staging (on main branch)
  # =====================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "This would typically deploy to Kubernetes/Docker Swarm"
          echo "Image: tournament-service:${{ github.sha }}"
          
      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests on staging..."
          echo "This would test critical endpoints on staging"

  # =====================================================
  # Notification
  # =====================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, security-scan]
    if: always()
    
    steps:
      - name: Notify success
        if: ${{ needs.build-and-test.result == 'success' && needs.docker-build.result == 'success' }}
        run: |
          echo "✅ CI/CD Pipeline completed successfully!"
          echo "📊 All tests passed"
          echo "🐳 Docker image built successfully"
          echo "🔒 Security scan completed"
          
      - name: Notify failure
        if: ${{ needs.build-and-test.result == 'failure' || needs.docker-build.result == 'failure' }}
        run: |
          echo "❌ CI/CD Pipeline failed!"
          echo "Please check the logs for details"
          exit 1