name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =====================================================
  # Create GitHub Release
  # =====================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Tournament Service ${{ github.ref }}
          body: |
            ## 🏆 Tournament Service Release ${{ github.ref }}
            
            ### 📋 What's New
            - Production-ready Spring Boot 3.3.6 application
            - JWT authentication with Spring Security
            - PostgreSQL integration with Flyway migrations
            - Docker containerization
            - Comprehensive test suite (220+ tests)
            - OpenAPI 3.0 documentation
            
            ### 🚀 Deployment
            ```bash
            # Docker
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            
            # Docker Compose
            docker-compose up -d
            
            # Kubernetes
            kubectl apply -f k8s/
            ```
            
            ### 📚 Documentation
            - [API Documentation](https://your-domain.com/swagger-ui.html)
            - [Setup Guide](README.md)
            - [Deployment Guide](docs/)
            
            ### 🔧 Configuration
            See `.env.example` for required environment variables.
            
            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v1.0.0...${{ github.ref_name }}
          draft: false
          prerelease: false

  # =====================================================
  # Build & Test
  # =====================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tournament_db
          POSTGRES_USER: tournament_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew build
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tournament_db
          DB_USERNAME: tournament_user
          DB_PASSWORD: test_password
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS0yNTZiaXRz
          
      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: build/libs/tournament-service-be-1.0.0-MVP.jar
          asset_name: tournament-service-${{ github.ref_name }}.jar
          asset_content_type: application/java-archive

  # =====================================================
  # Docker Build & Push
  # =====================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: create-release
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json
          
      - name: Upload SBOM to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: sbom.spdx.json
          asset_name: tournament-service-${{ github.ref_name }}-sbom.spdx.json
          asset_content_type: application/json

  # =====================================================
  # Deploy to Production
  # =====================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [create-release, build, docker]
    environment: production
    
    steps:
      - name: Deploy to Production
        run: |
          echo "🚀 Deploying Tournament Service ${{ github.ref_name }} to Production"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          echo "This would typically:"
          echo "  - Update Kubernetes deployments"
          echo "  - Run database migrations"
          echo "  - Perform health checks"
          echo "  - Update load balancer configuration"
          
      - name: Post-deployment verification
        run: |
          echo "🔍 Running post-deployment verification..."
          echo "This would typically:"
          echo "  - Test critical API endpoints"
          echo "  - Verify database connectivity"
          echo "  - Check application metrics"
          echo "  - Validate JWT authentication"