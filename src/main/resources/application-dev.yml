# =====================
# Development Profile Configuration
# =====================
# Активируется с: --spring.profiles.active=dev или SPRING_PROFILES_ACTIVE=dev
#
# ⚠️ DEV ONLY - This secret is for local development only!
# NEVER use this secret in production!

spring:
  jpa:
    show-sql: true
  cloud:
    compatibility-verifier:
      enabled: false
  
  # Flyway с seed data для dev
  flyway:
    # Добавляем seed каталог к locations
    locations: classpath:db/migration,classpath:db/seed
    # Placeholder для условной загрузки seed data
    placeholders:
      seedData: "true"

# Более подробное логирование в dev
logging:
  level:
    root: INFO
    com.chessai.tournament: DEBUG
    com.chessai.tournament.security: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# =====================
# JWT - Development Secret
# =====================
# ⚠️ WARNING: This is a DEVELOPMENT-ONLY secret!
# This value is publicly known and must NEVER be used in production.
# Generate production secret: openssl rand -base64 32
jwt:
  secret: ZGV2LW9ubHktc2VjcmV0LWtleS1mb3ItbG9jYWwtdGVzdGluZy0yNTZiaXRz

# =====================================================
# GitHub OAuth2 Development Configuration
# =====================================================
# For development, you can use test values or create a GitHub OAuth App
# Register at: https://github.com/settings/developers
spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dev-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dev-client-secret}

# Actuator - открыты все endpoints для отладки
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always



